<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ტექსტის კონვერტორი</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf6ff 0%, #d6efff 100%);
      color: #111;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 8px 18px;
    }
    .logo-wrap {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 2px;
    }
    .logo {
      width: 180px;
      height: auto;
      display: block;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin: 4px 0 8px;
      font-weight: 700;
    }
    .intro {
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      margin: 0 0 4px;
    }
    .panel {
      border-top: 3px solid #1f8fe5;
      padding-top: 8px;
      margin-top: 8px;
    }
    .controls {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }
    select, button {
      height: 36px;
      border: 1px solid #b7d9f3;
      font-size: 15px;
      padding: 0 12px;
      background: white;
      border-radius: 6px;
    }
    button {
      background: #1f8fe5;
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      padding: 0 24px;
    }
    button:hover { background: #1678c4; }
    .arrow {
      font-size: 34px;
      color: #1f8fe5;
      padding-bottom: 2px;
    }
    .check {
      height: 36px;
      display: flex;
      align-items: center;
      border: 1px solid #b7d9f3;
      background: white;
      padding: 0 12px;
      font-size: 14px;
      gap: 7px;
      border-radius: 6px;
    }
    textarea {
      width: 100%;
      min-height: 128px;
      resize: vertical;
      border: 1px solid #b7d9f3;
      background: white;
      padding: 12px;
      font-size: 16px;
      line-height: 1.6;
      outline: none;
      border-radius: 8px;
      margin-top: 12px;
    }
    textarea:focus {
      border-color: #1f8fe5;
      box-shadow: 0 0 0 3px rgba(31, 143, 229, 0.13);
    }
    textarea[readonly] { background: #f8fcff; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    #copyBtn {
      background: #1f8fe5;
      color: white;
      border: none;
    }
    #copyBtn:hover { background: #1678c4; }
    .secondary {
      background: #fff;
      color: #333;
      border: 1px solid #b7d9f3;
    }
    .secondary:hover { background: #e8f4ff; }
    .note, .status {
      margin-top: 5px;
      font-size: 13px;
      color: #555;
    }
    .status.success { color: #137333; }
    .status.error { color: #b3261e; }
    .field-title {
      margin-top: 5px;
      margin-bottom: -7px;
      font-weight: 700;
      color: #234;
    }
  </style>
</head>

    <h1>ტექსტის კონვერტორი</h1>

    <p class="intro">
      ჩასვით ტექსტი, აირჩიეთ საწყისი და საბოლოო კოდირება და დააჭირეთ გადაყვანის ღილაკს.
    </p>

    <section class="panel">
      <div class="controls">
        <div class="group">
          <label for="fromEncoding">საიდან:</label>
          <select id="fromEncoding">
            <option value="auto">ავტომატური ამოცნობა</option>
            <option value="latin">ლათინური / qwerty</option>
            <option value="unicode">ქართული Unicode</option>
            <option value="acadnusx">AcadNusx / ძველი ფონტი</option>
            <option value="bpglegacy">Sylfaen / BPG ძველი კოდირება</option>
            <option value="geotimes">GEO Times / GEO ძველი კოდირება</option>
          </select>
        </div>

        <div class="arrow">→</div>

        <div class="group">
          <label for="toEncoding">სად:</label>
          <select id="toEncoding">
            <option value="unicode">ქართული Unicode</option>
            <option value="latin">ლათინური / qwerty</option>
            <option value="acadnusx">AcadNusx / ძველი ფონტი</option>
            <option value="bpglegacy">Sylfaen / BPG ძველი კოდირება</option>
            <option value="geotimes">GEO Times / GEO ძველი კოდირება</option>
          </select>
        </div>

        <label class="check">
          <input type="checkbox" id="keepHtml" checked />
          HTML-ტეგების შენარჩუნება
        </label>

        <label class="check">
          <input type="checkbox" id="smartGeoOnly" checked />
          ინგლისური ტექსტის უცვლელად დატოვება
        </label>

        <button id="convertBtn" type="button">გადაყვანა</button>
      </div>

      <div class="field-title">საწყისი ტექსტი</div>
      <textarea id="textInput" placeholder="ჩასვით გადასაყვანი ტექსტი..."></textarea>

      <div class="field-title">გადაყვანილი ტექსტი</div>
      <textarea id="textOutput" placeholder="აქ გამოჩნდება გადაყვანილი ტექსტი..." readonly></textarea>

      <div class="actions">
        <button id="copyBtn" type="button">გადაყვანილი ტექსტის კოპირება</button>
        <button class="secondary" id="clearBtn" type="button">გასუფთავება</button>
      </div>

      <div id="status" class="status"></div>

      <div class="note">
        შენიშვნა: თუ ბრაუზერი ავტომატურ კოპირებას დაბლოკავს, ტექსტი ავტომატურად მოინიშნება და მომხმარებელს შეეძლება Ctrl + C-ით დაკოპირება.
      </div>
    </section>

        unicode: 'ქართული Unicode',
        latin: 'ლათინური / qwerty',
        geotimes: 'GEO Times / GEO ძველი კოდირება',
        acadnusx: 'AcadNusx / ძველი ფონტი',
        bpglegacy: 'Sylfaen / BPG ძველი კოდირება'
      };

      var legacyTypes = ['acadnusx', 'bpglegacy', 'geotimes'];
      var textInput = document.getElementById('textInput');
      var textOutput = document.getElementById('textOutput');
      var fromEncoding = document.getElementById('fromEncoding');
      var toEncoding = document.getElementById('toEncoding');
      var keepHtml = document.getElementById('keepHtml');
      var statusEl = document.getElementById('status');
      var convertBtn = document.getElementById('convertBtn');
      var copyBtn = document.getElementById('copyBtn');
      var clearBtn = document.getElementById('clearBtn');

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = ('status ' + (type || '')).trim();
      }

      function replaceByPairs(text, pairs) {
        var result = String(text || '');
        for (var i = 0; i < pairs.length; i += 1) {
          result = result.split(pairs[i][0]).join(pairs[i][1]);
        }
        return result;
      }

      function convertLegacyToUnicode(text) {
        return replaceByPairs(text, legacyGeoPairs);
      }

      function detectEncoding(text) {
        var sample = String(text || '').slice(0, 1500);
        var geoChars = (sample.match(/[აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ]/g) || []).length;
        var legacyChars = (sample.match(/[ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäå]/g) || []).length;
        var latinGeoPattern = (sample.match(/(sh|ch|zh|ts|dz|kh|gh)/gi) || []).length;
        var geoTimesCodes = (sample.match(/GE\d{2}[A-Z]{2}\d|GEO\s?Times|Geo_Times/gi) || []).length;

        if (legacyChars > 3 || geoTimesCodes > 0) return 'geotimes';
        if (geoChars > 5) return 'unicode';
        if (latinGeoPattern > 2) return 'latin';
        return 'unicode';
      }

      function updateAutoDetectedEncoding() {
        if (fromEncoding.value !== 'auto') return;
        var detected = detectEncoding(textInput.value);
        var selectedOption = fromEncoding.querySelector('option[value="auto"]');
        selectedOption.textContent = 'ავტომატური ამოცნობა — ' + (labels[detected] || 'უცნობი');
        fromEncoding.dataset.detected = detected;
      }

      function convertChunk(chunk, from, to) {
        if (from === 'latin' && to === 'unicode') return replaceByPairs(chunk, latinToGeoPairs);
        if (from === 'unicode' && to === 'latin') return replaceByPairs(chunk, geoToLatinPairs);
        if (legacyTypes.indexOf(from) !== -1 && to === 'unicode') return convertLegacyToUnicode(chunk);
        if (from === 'unicode' && legacyTypes.indexOf(to) !== -1) return replaceByPairs(chunk, unicodeToLegacyPairs);
        if (legacyTypes.indexOf(from) !== -1 && to === 'latin') return replaceByPairs(convertLegacyToUnicode(chunk), geoToLatinPairs);
        if (from === 'latin' && legacyTypes.indexOf(to) !== -1) return replaceByPairs(replaceByPairs(chunk, latinToGeoPairs), unicodeToLegacyPairs);
        if (legacyTypes.indexOf(from) !== -1 && legacyTypes.indexOf(to) !== -1) return replaceByPairs(convertLegacyToUnicode(chunk), unicodeToLegacyPairs);
        return chunk;
      }

      function convertText(text, from, to, shouldKeepHtml) {
        var realFrom = from === 'auto' ? detectEncoding(text) : from;
        var source = String(text || '');
        if (realFrom === to) return source;
        if (!shouldKeepHtml) return convertChunk(source, realFrom, to);

        return source.replace(/(<[^>]*>)|([^<]+)/g, function (match, tag, content) {
          if (tag) return tag;
          return convertChunk(content || '', realFrom, to);
        });
      }

      async function copyTextSafely(text) {
        var value = String(text || '');
        if (!value) {
          setStatus('საკოპირებელი ტექსტი ცარიელია.', 'error');
          return false;
        }

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(value);
            setStatus('გადაყვანილი ტექსტი დაკოპირდა.', 'success');
            return true;
          }
        } catch (error) {
          console.warn('Clipboard API blocked, trying fallback copy.', error);
        }

        try {
          textOutput.removeAttribute('readonly');
          textOutput.focus();
          textOutput.select();
          textOutput.setSelectionRange(0, textOutput.value.length);
          var copied = document.execCommand('copy');
          textOutput.setAttribute('readonly', 'readonly');
          if (copied) {
            setStatus('გადაყვანილი ტექსტი დაკოპირდა.', 'success');
            return true;
          }
        } catch (error2) {
          console.warn('Fallback copy failed.', error2);
          textOutput.setAttribute('readonly', 'readonly');
        }

        textOutput.focus();
        textOutput.select();
        setStatus('ბრაუზერმა ავტომატური კოპირება დაბლოკა. ტექსტი მონიშნულია — დააჭირეთ Ctrl + C.', 'error');
        return false;
      }

      if (convertBtn) {
        convertBtn.addEventListener('click', function () {
          var detected = fromEncoding.value === 'auto' ? detectEncoding(textInput.value) : fromEncoding.value;
          textOutput.value = convertText(textInput.value, fromEncoding.value, toEncoding.value, keepHtml.checked);
          if (fromEncoding.value === 'auto') fromEncoding.value = detected;
          setStatus('გადაყვანა შესრულდა: ' + (labels[detected] || detected) + ' → ' + (labels[toEncoding.value] || toEncoding.value) + '.', 'success');
        });
      }

      if (textInput) {
        textInput.addEventListener('input', updateAutoDetectedEncoding);
        textInput.addEventListener('paste', function () { setTimeout(updateAutoDetectedEncoding, 0); });
      }

      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          copyTextSafely(textOutput.value || textInput.value);
        });
      }

      if (clearBtn) {
        clearBtn.addEventListener('click', function () {
          textInput.value = '';
          textOutput.value = '';
          fromEncoding.querySelector('option[value="auto"]').textContent = 'ავტომატური ამოცნობა';
          fromEncoding.dataset.detected = '';
          setStatus('ველები გასუფთავდა.', 'success');
        });
      }
    });
  </script>
</body>
</html>
